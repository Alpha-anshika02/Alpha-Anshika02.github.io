<!DOCTYPE html>
<html>
<head>
<title>Exam Pro App</title>

<style>
body{
  font-family:Arial;
  background:#eef7ff;
  text-align:center;
  padding:20px;
}

.card{
  background:white;
  padding:15px;
  margin:10px;
  border-radius:12px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

button{
  padding:10px;
  margin:8px;
  background:blue;
  color:white;
  border:none;
  border-radius:8px;
}
</style>
</head>

<body>

<h1>📱 Exam Pro App</h1>

<div class="card">
<h3>👤 Profile</h3>
<input id="name" placeholder="Enter your name">
<br><br>
<button onclick="saveName()">Save</button>
<p id="showName"></p>
</div>

<div class="card">
<h3>🔥 Daily Streak</h3>
<p id="streak">0 days</p>
<button onclick="addStreak()">Practice Done</button>
</div>

<div class="card">
<h3>⭐ XP Points</h3>
<p id="xp">0 XP</p>
<button onclick="addXP()">Gain XP</button>
</div>

<div class="card">
<h3>🏆 Badge</h3>
<p id="badge">Beginner</p>
</div>

<script>
let xp = localStorage.getItem("xp") || 0;
let streak = localStorage.getItem("streak") || 0;
let name = localStorage.getItem("name") || "";

document.getElementById("xp").innerText = xp;
document.getElementById("streak").innerText = streak + " days";
document.getElementById("showName").innerText = name;

function saveName(){
  let n = document.getElementById("name").value;
  localStorage.setItem("name", n);
  document.getElementById("showName").innerText = n;
}

function addXP(){
  xp = parseInt(xp) + 10;
  localStorage.setItem("xp", xp);
  document.getElementById("xp").innerText = xp;
  updateBadge();
}

function addStreak(){
  streak = parseInt(streak) + 1;
  localStorage.setItem("streak", streak);
  document.getElementById("streak").innerText = streak + " days";
  updateBadge();
}

function updateBadge(){
  let badge = "Beginner";

  if(xp > 50) badge = "Learner";
  if(xp > 150) badge = "Smart Player";
  if(xp > 300) badge = "Pro Candidate";
  if(xp > 500) badge = "🔥 Champion";

  document.getElementById("badge").innerText = badge;
}
</script>

</body>
</html>
