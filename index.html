<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exam Prep App</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- HOME -->
<div id="home">

  <header>
    <h1>📘 Exam Prep App</h1>
    <p>SSC • IBPS • Mock Test</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>SSC Quiz</h2>
      <button onclick="startQuiz('SSC')">Start</button>
    </div>

    <div class="card">
      <h2>IBPS Quiz</h2>
      <button onclick="startQuiz('IBPS')">Start</button>
    </div>

    <div class="card">
      <h2>Mock Test</h2>
      <button onclick="startQuiz('MOCK')">Start</button>
    </div>

  </div>

  <footer>
    <p>Made for Students ❤️</p>
  </footer>

</div>

<!-- QUIZ SCREEN -->
<div id="quiz" style="display:none;"></div>

<!-- RESULT SCREEN -->
<div id="result" style="display:none;"></div>

<script src="script.js"></script>
</body>
</html>
