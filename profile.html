<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profile - ExamVerse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a href="index.html" class="navbar-brand">⬅ Profile</a>
  </div>
</nav>

<div class="container mt-3">

<h3>👤 Your Profile</h3>

<div class="p-3 bg-white shadow-sm rounded mt-3">

<label>Enter Your Name</label>
<input type="text" id="name" class="form-control mt-2" placeholder="Your name">

<button class="btn btn-primary w-100 mt-3" onclick="saveName()">
Save Name
</button>

</div>

<div class="p-3 bg-white shadow-sm rounded mt-3">

<h5>📊 Progress</h5>

<p class="text-muted">Typing Best Score + Quiz Score stored in browser</p>

<button class="btn btn-success w-100" onclick="showProgress()">
Show Progress
</button>

<p id="progress" class="mt-3"></p>

</div>

</div>

<script>
function saveName(){
    let name = document.getElementById("name").value;
    localStorage.setItem("username", name);
    alert("Name Saved!");
}

window.onload = function(){
    let saved = localStorage.getItem("username");
    if(saved){
        document.getElementById("name").value = saved;
    }
}

function showProgress(){
    let best = localStorage.getItem("bestWPM") || 0;
    let name = localStorage.getItem("username") || "User";

    document.getElementById("progress").innerHTML =
    "👤 Name: " + name +
    "<br>⌨️ Best Typing WPM: " + best;
}
</script>

</body>
</html>
