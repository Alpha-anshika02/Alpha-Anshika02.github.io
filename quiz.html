<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz - ExamVerse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a href="index.html" class="navbar-brand">⬅ Quiz</a>
  </div>
</nav>

<div class="container mt-3">

<h3>📝 Daily Quiz</h3>

<div class="p-3 bg-white shadow-sm rounded mt-3">

<h5 id="question">Question loading...</h5>

<div class="mt-3">

<button class="btn btn-outline-primary w-100 mb-2" onclick="checkAnswer(this)">Option A</button>
<button class="btn btn-outline-primary w-100 mb-2" onclick="checkAnswer(this)">Option B</button>
<button class="btn btn-outline-primary w-100 mb-2" onclick="checkAnswer(this)">Option C</button>
<button class="btn btn-outline-primary w-100 mb-2" onclick="checkAnswer(this)">Option D</button>

</div>

</div>

<div class="p-3 bg-white shadow-sm rounded mt-3 text-center">

<h5 id="result">Score: 0</h5>

<button class="btn btn-success w-100 mt-2" onclick="nextQuestion()">
Next Question
</button>

</div>

</div>

<script>
let questions = [
{
q: "Capital of India?",
options: ["Mumbai", "Delhi", "Kolkata", "Chennai"],
answer: "Delhi"
},
{
q: "2 + 2 = ?",
options: ["3", "4", "5", "6"],
answer: "4"
},
{
q: "HTML stands for?",
options: ["Hyper Text Markup Language", "High Text Machine", "Home Tool Markup", "None"],
answer: "Hyper Text Markup Language"
}
];

let index = 0;
let score = 0;

function loadQuestion(){
    let q = questions[index];
    document.getElementById("question").innerText = q.q;

    let buttons = document.querySelectorAll("button");

    buttons.forEach((btn, i)=>{
        if(i < 4){
            btn.innerText = q.options[i];
        }
    });
}

function checkAnswer(btn){
    if(btn.innerText === questions[index].answer){
        score++;
    }

    document.getElementById("result").innerText = "Score: " + score;
}

function nextQuestion(){
    index++;

    if(index < questions.length){
        loadQuestion();
    } else {
        document.getElementById("question").innerText = "Quiz Finished 🎉";
    }
}

loadQuestion();
</script>

</body>
</html>
