<!DOCTYPE html>
<html>
<head>
<title>Advanced Typing Test</title>

<style>
body{
  font-family:Arial;
  background:#eef7ff;
  text-align:center;
  padding:20px;
}

#text{
  background:white;
  padding:15px;
  border-radius:10px;
  margin:15px;
  font-size:18px;
}

textarea{
  width:90%;
  height:120px;
  font-size:18px;
}

button{
  padding:10px 20px;
  margin:8px;
  background:blue;
  color:white;
  border:none;
  border-radius:8px;
}

#timer{
  font-size:20px;
  color:red;
}

#result{
  font-size:18px;
  margin-top:15px;
}
</style>
</head>

<body>

<h1>⌨️ Advanced Typing Test</h1>

<div id="timer">Time: 0s</div>

<p id="text">
Practice daily to improve your typing speed and accuracy for exams like SSC, IBPS and RRB.
</p>

<textarea id="input" placeholder="Start typing here..."></textarea>

<br>

<button onclick="startTest()">Start</button>
<button onclick="endTest()">Submit</button>
<button onclick="resetTest()">Reset</button>

<p id="result"></p>

<script>
let startTime;
let timer;
let seconds = 0;

function startTest(){
  document.getElementById("input").value = "";
  document.getElementById("result").innerHTML = "";

  seconds = 0;
  document.getElementById("timer").innerHTML = "Time: 0s";

  startTime = new Date().getTime();

  clearInterval(timer);
  timer = setInterval(()=>{
    seconds++;
    document.getElementById("timer").innerHTML = "Time: " + seconds + "s";
  },1000);
}

function endTest(){
  clearInterval(timer);

  let endTime = new Date().getTime();
  let timeTaken = (endTime - startTime) / 1000 / 60;

  let text = document.getElementById("text").innerText.trim().split(" ");
  let typed = document.getElementById("input").value.trim().split(" ");

  let correct = 0;
  let wrong = 0;

  for(let i=0; i<typed.length; i++){
    if(typed[i] === text[i]){
      correct++;
    } else {
      wrong++;
    }
  }

  let wpm = Math.round(correct / timeTaken);
  let accuracy = Math.round((correct / text.length) * 100);

  document.getElementById("result").innerHTML =
    "⚡ Speed: " + wpm + " WPM<br>" +
    "🎯 Accuracy: " + accuracy + "%<br>" +
    "❌ Mistakes: " + wrong;
}

function resetTest(){
  clearInterval(timer);
  seconds = 0;
  document.getElementById("timer").innerHTML = "Time: 0s";
  document.getElementById("input").value = "";
  document.getElementById("result").innerHTML = "";
}
</script>

</body>
</html>
