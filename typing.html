<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Typing Test - ExamVerse</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>

<body>

<nav class="navbar navbar-dark bg-primary">
  <div class="container-fluid">
    <a href="index.html" class="navbar-brand">⬅ Typing Test</a>
  </div>
</nav>

<div class="container mt-3">

<h3>⌨️ Typing Practice</h3>

<!-- TIMER -->
<div class="p-3 bg-white shadow-sm rounded text-center mb-3">
<h4 id="timer">60</h4>
<p class="text-muted">Seconds Left</p>
</div>

<!-- TEXT -->
<div class="p-3 bg-white shadow-sm rounded mb-3">
<p id="text">
The quick brown fox jumps over the lazy dog. Practice daily to improve your speed and accuracy.
</p>
</div>

<!-- INPUT -->
<textarea id="input" class="form-control" rows="4" placeholder="Start typing here..."></textarea>

<!-- START -->
<button class="btn btn-primary w-100 mt-3" onclick="startTest()">
Start Test
</button>

<!-- RESULT -->
<div class="p-3 bg-white shadow-sm rounded mt-3 text-center">
<h5>Result</h5>
<p id="result">WPM: - | Accuracy: -</p>

<button class="btn btn-success w-100 mt-2" onclick="startTest()">
🔁 Restart Test
</button>
</div>

</div>

<script>
let time = 60;
let interval;

const sampleText = document.getElementById("text").innerText;

function startTest(){
    let input = document.getElementById("input");
    input.value = "";
    input.focus();

    time = 60;
    document.getElementById("timer").innerText = time;

    clearInterval(interval);

    let best = localStorage.getItem("bestWPM") || 0;
    document.getElementById("result").innerHTML = "🏆 Best: " + best;

    interval = setInterval(()=>{
        time--;
        document.getElementById("timer").innerText = time;

        if(time === 0){
            clearInterval(interval);
            calculateResult();
        }
    },1000);
}

function calculateResult(){
    let typedText = document.getElementById("input").value.trim();

    let typedWordsArr = typedText.split(" ").filter(w => w !== "");
    let typedWords = typedWordsArr.length;

    let wpm = Math.round(typedWords);

    let originalWords = sampleText.split(" ");

    let correct = 0;

    for(let i = 0; i < typedWordsArr.length; i++){
        if(typedWordsArr[i] === originalWords[i]){
            correct++;
        }
    }

    let accuracy = typedWordsArr.length > 0 
        ? Math.round((correct / originalWords.length) * 100)
        : 0;

    let best = localStorage.getItem("bestWPM");

    if(!best || wpm > best){
        localStorage.setItem("bestWPM", wpm);
        best = wpm;
    }

    document.getElementById("result").innerHTML =
    "WPM: " + wpm +
    " | Accuracy: " + accuracy + "%" +
    "<br>🏆 Best: " + best;
}
</script>

</body>
</html>
