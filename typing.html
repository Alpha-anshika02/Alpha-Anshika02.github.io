<!DOCTYPE html>
<html>
<head>
<title>Typing Practice</title>
<style>
body{
  font-family:Arial;
  background:#eef7ff;
  padding:20px;
  text-align:center;
}
textarea{
  width:90%;
  height:120px;
  font-size:18px;
}
button{
  padding:10px 20px;
  margin-top:10px;
}
</style>
</head>
<body>

<h1>⌨️ Typing Practice</h1>

<p><b>Type this:</b></p>

<p id="text">
Practice makes perfect. Keep typing every day to improve your speed and accuracy.
</p>

<textarea id="input" placeholder="Start typing here..."></textarea>

<br>

<button onclick="checkTyping()">Check Result</button>

<p id="result"></p>

<script>
function checkTyping(){
let original=document.getElementById("text").innerText.trim();
let typed=document.getElementById("input").value.trim();

if(original===typed){
document.getElementById("result").innerHTML="✅ Perfect! 100% Accurate";
}else{
document.getElementById("result").innerHTML="❌ Keep Practicing!";
}
}
</script>

</body>
</html>
